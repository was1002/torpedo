<!DOCTYPE html>
<html lang="hu">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Torpedó</title>
        <link rel="icon" href="./images/redX.png">
        <link rel="stylesheet" href="sajat_torpedo.css">
    </head>
    <body>
        <div id="game-board"></div>
        <div id="tools">
            <img src="./images/dot.png" alt="miss" id="miss" class="tool" draggable="false">
            <img src="./images/redX.png" alt="hit" id="hit" class="tool" draggable="false">
            <img src="./images/ship.png" alt="sunken" id="sunken" class="tool" draggable="false">
            <img src="./images/undo.png" alt="undo" id="undo" class="tool" draggable="false">
            <img src="./images/newGame.png" alt="newGame" id="newGame" class="tool" draggable="false">
        </div>

        <!-- INCLUDING JS FILES -->
        <script src="grid.js" type="text/javascript"></script>
        <script src="fleet.js" type="text/javascript"></script>
        <script src="input_section.js" type="text/javascript"></script>
        <script src="buttons_section.js" type="text/javascript"></script>
        <script src="algorithm_section.js" type="text/javascript"></script>
        <script src="init.js" type="text/javascript"></script>

    </body>
</html>
